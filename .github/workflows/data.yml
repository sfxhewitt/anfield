name: refresh-data
on: {schedule: [{cron: "17 */3 * * *"}], workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh fetch.sh && git config user.name bot && git config user.email bot@users.noreply.github.com && git add data && (git diff --cached --quiet || (git commit -m "data: refresh" && git push))
